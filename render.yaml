databases:
  - name: lottery-db
    plan: starter
    databaseName: lottery
    user: lottery_user

services:
  - type: web
    name: lottery-results-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: LOTTERY_TIMEZONE
        value: Asia/Kolkata
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
